# TYPE  DATABASE  USER      ADDRESS   METHOD

# Внутри контейнера суперпользователь заходит через сокет по peer
# (нужно скриптам инициализации). Остальным через сокет только по паролю.
local   all       postgres            peer
local   all       all                 scram-sha-256

# Любые сетевые подключения только по паролю через SCRAM, trust не используется
host    all       all       all       scram-sha-256
