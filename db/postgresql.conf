# Конфигурация сервера. Всё, что здесь не указано, берётся по умолчанию.

listen_addresses = '*'
port = 5432
max_connections = 50

hba_file = '/etc/postgresql/pg_hba.conf'

# Пароли хранятся и проверяются только через SCRAM, md5 не используется
password_encryption = 'scram-sha-256'

# Не держать соединение, если клиент пропал
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5
authentication_timeout = 10s

# Локаль и время
lc_messages = 'ru_RU.utf8'
lc_monetary = 'ru_RU.utf8'
lc_numeric = 'ru_RU.utf8'
lc_time = 'ru_RU.utf8'
default_text_search_config = 'pg_catalog.russian'
timezone = 'Europe/Moscow'
log_timezone = 'Europe/Moscow'

# Журналирование подключений, чтобы было видно, кто и откуда заходил
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d from %h '
