name: rpzs

services:
  db:
    build: ./db
    image: rpzs-postgres:18.6-ru
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # наружу только на localhost и на нестандартный порт
      - "127.0.0.1:55432:5432"
    healthcheck:
      # через TCP: по сокету проверка шла бы от root и падала на peer
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pinger:
    build: ./pinger
    image: rpzs-pinger:1.1.0
    env_file: ./pinger.env
    volumes:
      - pinger-logs:/logs
    # depends_on специально нет: пингер должен сам переживать недоступную БД
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  shop:
    build: ./shop
    image: rpzs-shop:1.0.0
    env_file: ./shop.env
    volumes:
      - shop-logs:/logs
    depends_on:
      db:
        condition: service_healthy
    # интерактивный режим: запуск через docker compose run --rm shop
    stdin_open: true
    tty: true
    profiles: [app]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  pinger-logs:
  shop-logs:
