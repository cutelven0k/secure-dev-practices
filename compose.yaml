name: rpzs

services:
  db:
    build: ./db
    image: rpzs-postgres:18.6-ru
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # наружу только на localhost и на нестандартный порт
      - "127.0.0.1:55432:5432"
    healthcheck:
      # через TCP: по сокету проверка шла бы от root и падала на peer
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
